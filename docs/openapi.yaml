openapi: 3.0.3
info:
  title: SAMAR API
  version: 1.1.0
  description: |
    Deteksi fraud klaim JKN lintas faskes di atas data terpseudonimisasi. Data contoh sintetis.
    Sistem tidak menjatuhkan keputusan fraud: keluaran berupa skor, alasan, dan prioritas review.
    Login di POST /auth/login, lalu klik Authorize dan tempel token.
servers:
  - url: /api/v1
security:
  - bearer: []
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties: { code: { type: string }, message: { type: string }, details: {} }
    ClaimInput:
      type: object
      required: [claim_id, level, participant_id, facility_id, admit_date, diagnosis_primary, billed_amount]
      properties:
        claim_id: { type: string, example: FKL02-000123 }
        level: { type: string, enum: [FKTP, FKRTL, PNK] }
        participant_id: { type: string, example: PSTV01-0001, description: Ditokenisasi di gateway; tidak diteruskan ke layanan lain }
        facility_id: { type: string, example: RS-A }
        admit_date: { type: string, format: date, example: '2026-10-01' }
        discharge_date: { type: string, format: date, example: '2026-10-05' }
        diagnosis_primary: { type: string, description: ICD-10, example: J18.9 }
        diagnosis_secondary: { type: array, items: { type: string } }
        procedures: { type: array, items: { type: string }, description: ICD-9-CM, example: ['87.44'] }
        inacbg_code: { type: string }
        billed_amount: { type: number, example: 6200000 }
    Signal:
      type: object
      properties:
        detector: { type: string }
        modus: { type: string }
        score: { type: number }
        reason: { type: string }
    VerifyResult:
      type: object
      properties:
        claim_id: { type: string }
        subject_token: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        risk: { type: string, enum: [NONE, LOW, MEDIUM, HIGH] }
        case_id: { type: string, nullable: true }
        signals: { type: array, items: { $ref: '#/components/schemas/Signal' } }
        explanation: { type: string }
        explanation_source: { type: string, enum: [llm, template] }
        ml_status: { type: string, enum: [ok, unavailable, disabled, local], description: '"unavailable" berarti layanan ml mati dan skor hanya dari aturan' }
        model_version: { type: string }
        latency_ms: { type: integer }
    Case:
      type: object
      properties:
        case_id: { type: string }
        claim_id: { type: string }
        fraud_ref: { type: string, description: Token pasien }
        score: { type: integer }
        risk_score: { type: integer }
        risk_level: { type: string, enum: [LOW, MEDIUM, HIGH] }
        modi: { type: array, items: { type: string } }
        status: { type: string, enum: [BARU, DITINJAU, BUTUH_INFO, TERKONFIRMASI, DITOLAK_FALSE_POSITIVE, SELESAI] }
        facilities: { type: array, items: { type: string } }
        excess_amount: { type: number, description: Estimasi rupiah berlebih dari aturan, bukan angka audit }
        explanation: { type: string }
        explanation_source: { type: string, enum: [llm, template] }
        ml_status: { type: string }
        created_ms: { type: integer }
    Batch:
      type: object
      properties:
        batch_id: { type: string }
        total: { type: integer }
        accepted: { type: integer }
        rejected: { type: integer }
        cases: { type: integer }
        errors: { type: array, items: { type: object, properties: { row: { type: integer }, message: { type: string } } } }
paths:
  /auth/login:
    post:
      summary: Masuk dan dapatkan JWT (15 menit)
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [username, password], properties: { username: { type: string, example: verifikator }, password: { type: string, example: demo-verifikator } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { token: { type: string }, role: { type: string }, expires_in: { type: integer } } } } } }
        '401': { description: Gagal, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /me:
    get:
      summary: Profil dan peran
      responses: { '200': { description: OK } }
  /claims/upload:
    post:
      summary: Unggah klaim batch CSV (peran faskes, verifikator)
      description: |
        Body mentah `text/csv`. Header memakai nama prototype atau kode BPJS (PSTV01, FKL02, FKL47; lihat config/column-map.json).
        Validasi per baris; baris gagal dilaporkan dengan nomor baris (header = baris 1).
      requestBody:
        content:
          text/csv:
            schema: { type: string }
      responses:
        '200': { description: Hasil batch, content: { application/json: { schema: { $ref: '#/components/schemas/Batch' } } } }
        '415': { description: Content-Type bukan text/csv }
  /claims/batches/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    get:
      summary: Status batch milik pengunggah
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Batch' } } } }, '404': { description: Tidak ditemukan } }
  /verify:
    post:
      summary: Skor satu klaim secara sinkron (peran verifikator, admin)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ClaimInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/VerifyResult' } } } }
        '403': { description: Peran tidak berhak, atau peserta sudah dicabut (SUBJECT_REVOKED) }
        '422': { description: Validasi gagal, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /cases:
    get:
      summary: Daftar kasus (verifikator, auditor)
      parameters:
        - { name: risk, in: query, schema: { type: string, enum: [LOW, MEDIUM, HIGH] } }
        - { name: modus, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: faskes, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Case' } } } } } } }
  /cases/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    get:
      summary: Detail kasus, alasan, riwayat token lintas faskes, riwayat status
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Case' } } } } }
    patch:
      summary: Ubah status kasus (tercatat di case_events dan audit)
      requestBody: { content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [BARU, DITINJAU, BUTUH_INFO, TERKONFIRMASI, DITOLAK_FALSE_POSITIVE, SELESAI] }, note: { type: string } } } } } }
      responses: { '200': { description: OK }, '400': { description: Status tidak dikenal } }
  /cases/{id}/explain:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    post:
      summary: Buat ulang penjelasan (LLM hanya melihat token, ICD, angka, alasan; fallback templat)
      responses: { '200': { description: OK } }
  /cases/{id}/reveal:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    post:
      summary: Buka identitas (hanya auditor, alasan wajib, kuota harian, diaudit)
      requestBody: { content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 20 } } } } } }
      responses:
        '200': { description: Identitas dibuka dan tercatat di audit }
        '403': { description: Peran tidak berhak }
        '429': { description: Kuota habis }
  /tokens/revoke:
    post:
      summary: Cabut token peserta (admin). Klaim baru dari peserta ini ditolak di analitik
      requestBody: { content: { application/json: { schema: { type: object, properties: { subject_token: { type: string }, reason: { type: string } } } } } }
      responses: { '200': { description: OK } }
  /keys/rotate:
    post:
      summary: Mulai epoch pseudonim baru (admin)
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { rotation: { type: integer } } } } } } }
  /settings/threshold:
    get:
      summary: Ambang skor kasus saat ini
      responses: { '200': { description: OK } }
    put:
      summary: Ubah ambang skor kasus (admin, tercatat di audit)
      requestBody: { content: { application/json: { schema: { type: object, required: [case_score], properties: { case_score: { type: integer, minimum: 20, maximum: 100 } } } } } }
      responses: { '200': { description: OK }, '400': { description: Di luar rentang } }
  /dashboard/summary:
    get:
      summary: Ringkasan angka (verifikator, auditor, admin)
      responses: { '200': { description: OK } }
  /impact/simulate:
    post:
      summary: Simulasi dampak rupiah dari parameter (auditor, admin); asumsi ikut dikembalikan
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [annual_claim_value, fraud_rate, review_capacity, precision_at_k, recovery_rate]
              properties:
                annual_claim_value: { type: number }
                fraud_rate: { type: number }
                review_capacity: { type: number }
                precision_at_k: { type: number }
                recovery_rate: { type: number }
                biaya_operasional: { type: number }
      responses: { '200': { description: Hasil simulasi beserta asumsi } }
  /reports/cases.csv:
    get:
      summary: Ekspor kasus CSV (auditor)
      responses: { '200': { description: CSV, content: { text/csv: { schema: { type: string } } } } }
  /export/evalkit:
    get:
      summary: Zip scores.csv, truth.csv, cases.csv (admin)
      responses: { '200': { description: Zip, content: { application/zip: { schema: { type: string, format: binary } } } } }
  /audit:
    get:
      summary: Log audit berantai hash (admin)
      responses: { '200': { description: OK } }
  /audit/verify:
    get:
      summary: Verifikasi rantai hash audit (admin)
      responses: { '200': { description: '{ valid, entries, broken_at? }' } }
  /health:
    get:
      summary: Status layanan dan model ml
      security: []
      responses: { '200': { description: OK } }
