# OPSIONAL. Satu kontainer menjalankan semua layanan Node (Gateway + 5 microservice) via launcher;
# layanan ml (Python, scikit-learn) berjalan di kontainer terpisah sehingga ML_ENABLED=true.
# Urutan: npm run demo:reset (membuat services/ml/data/train.csv), lalu docker compose up --build, buka http://localhost:3000
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: samar, POSTGRES_PASSWORD: samar, POSTGRES_DB: samar }
    # Port db TIDAK dibuka ke host. Untuk npm start di host: docker compose -f docker-compose.yml -f docker-compose.hostdb.yml up -d db
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samar -d samar"]
      interval: 3s
      retries: 20
  # Satu kali jalan: skema vault/analytics/audit, peran per zona, dan GRANT (db/migrations). Zona token tidak punya akses ke vault.
  migrate:
    build: .
    command: ["node", "scripts/migrate.js"]
    environment:
      DATABASE_URL_ADMIN: postgresql://samar:samar@db:5432/samar
      PRIVATE_DB_PASSWORD: ${PRIVATE_DB_PASSWORD:-ganti-sandi-zona-pribadi}
      TOKEN_DB_PASSWORD: ${TOKEN_DB_PASSWORD:-ganti-sandi-zona-token}
    depends_on: { db: { condition: service_healthy } }
  ml:
    build: { context: ., dockerfile: Dockerfile.ml }
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-ganti-internal-key-demo-minimal-32-karakter}
    volumes: ["./services/ml/data:/app/data:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:4106/health', timeout=2)"]
      interval: 5s
      retries: 20
  samar:
    build: .
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      ML_ENABLED: "true"           # layanan ml di kontainer terpisah (lihat service ml)
      ML_URL: http://ml:4106
      DEMO_MODE: "true"            # demo: akun demo + skenario. Hapus untuk mode ketat.
      JWT_SECRET: ${JWT_SECRET:-ganti-jwt-secret-demo-minimal-32-karakter-xx}
      HMAC_MASTER_KEY: ${HMAC_MASTER_KEY:-ganti-master-key-demo-minimal-32-karakter}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-ganti-internal-key-demo-minimal-32-karakter}
      # URL per zona: privacy + gateway memakai peran samar_private (vault + audit); claims, fraud, notify memakai samar_token (analytics + audit insert).
      STORE: postgres
      DATABASE_URL: postgresql://samar_private:${PRIVATE_DB_PASSWORD:-ganti-sandi-zona-pribadi}@db:5432/samar
      DATABASE_URL_PRIVACY: postgresql://samar_private:${PRIVATE_DB_PASSWORD:-ganti-sandi-zona-pribadi}@db:5432/samar
      DATABASE_URL_GATEWAY: postgresql://samar_private:${PRIVATE_DB_PASSWORD:-ganti-sandi-zona-pribadi}@db:5432/samar
      DATABASE_URL_CLAIMS: postgresql://samar_token:${TOKEN_DB_PASSWORD:-ganti-sandi-zona-token}@db:5432/samar
      DATABASE_URL_FRAUD: postgresql://samar_token:${TOKEN_DB_PASSWORD:-ganti-sandi-zona-token}@db:5432/samar
      DATABASE_URL_NOTIFY: postgresql://samar_token:${TOKEN_DB_PASSWORD:-ganti-sandi-zona-token}@db:5432/samar
    depends_on:
      ml: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
